apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-service
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-service
  template:
    metadata:
      labels:
        app: library-service
        tier: backend
        depends-on: auth-service
    spec:
      containers:
        - name: library-service
          image: python:3.11-slim
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          command: ["python", "-c"]
          args:
            - |
              import time
              catalog = ['Book ' + str(i) * 100 for i in range(50000)]
              while True:
                  results = [b for b in catalog if 'Book 1' in b]
                  time.sleep(0.5)
---
apiVersion: v1
kind: Service
metadata:
  name: library-service
  namespace: campus
spec:
  selector:
    app: library-service
  ports:
    - port: 8002
      targetPort: 8000
