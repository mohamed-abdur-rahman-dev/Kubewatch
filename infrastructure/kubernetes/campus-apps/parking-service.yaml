apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-service
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-service
  template:
    metadata:
      labels:
        app: parking-service
        tier: backend
        depends-on: auth-service
    spec:
      containers:
        - name: parking-service
          image: python:3.11-slim
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          command: ["python", "-c"]
          args:
            - |
              import time, random, math
              while True:
                  x = sum(math.sqrt(i) for i in range(10000))
                  time.sleep(0.1)
---
apiVersion: v1
kind: Service
metadata:
  name: parking-service
  namespace: campus
spec:
  selector:
    app: parking-service
  ports:
    - port: 8001
      targetPort: 8000
