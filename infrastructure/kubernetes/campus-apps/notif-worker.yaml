apiVersion: apps/v1
kind: Deployment
metadata:
  name: notif-worker
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notif-worker
  template:
    metadata:
      labels:
        app: notif-worker
        tier: worker
    spec:
      containers:
        - name: notif-worker
          image: python:3.11-slim
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "200m"
              memory: "384Mi"
          command: ["python", "-c"]
          args:
            - |
              import time
              queue = []
              while True:
                  queue.append('notification')
                  if len(queue) > 100:
                      queue.pop(0)
                  time.sleep(1)
---
apiVersion: v1
kind: Service
metadata:
  name: notif-worker
  namespace: campus
spec:
  selector:
    app: notif-worker
  ports:
    - port: 8005
      targetPort: 8000
