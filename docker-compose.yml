# Root docker-compose — runs the full three-service monorepo stack.
# Infrastructure detail lives in infrastructure/docker/docker-compose.yml;
# this file is the convenient entry point developers run from the repo root.
#
# Usage:
#   docker compose up --build

services:

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ~/.kube:/root/.kube:ro
      - ~/.minikube:/root/.minikube:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - COLLECT_INTERVAL=15
      - POD_CACHE_TTL=10
      - AI_SERVICE_URL=http://ai-service:8001
      - INSIGHT_CACHE_TTL=20
    depends_on:
      - ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - LOG_LEVEL=info
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:1b
      - OLLAMA_TIMEOUT=90
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
