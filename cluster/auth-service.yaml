apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: core
    spec:
      containers:
        - name: auth-service
          image: python:3.11-slim
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          command: ["python", "-c"]
          args:
            - |
              import time, hashlib
              while True:
                  token = hashlib.sha256(str(time.time()).encode()).hexdigest()
                  time.sleep(0.01)
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: campus
spec:
  selector:
    app: auth-service
  ports:
    - port: 8004
      targetPort: 8000
